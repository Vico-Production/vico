name: Release installers

# Builds ready-to-install packages on GitHub's machines, so nobody who installs Vico
# ever needs compilers, Python, Node.js or Rust. Push a tag like v0.1.0 (or
# v0.1.0-preview.1 for a test build) and the installers appear on the Releases page.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Windows builds use the MSVC toolchain that GitHub's Windows machines already have.
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libportaudio2
      - name: Package the engine
        working-directory: services/agent
        run: |
          uv sync
          uv run python ../../scripts/build_sidecar.py
      - name: Build installers
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri build --config src-tauri/tauri.release.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: vico-${{ runner.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  publish:
    name: Publish the GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            **Install Vico**
            - **Windows 10/11:** download the `.exe` (or `.msi`) and run it. Windows may show a SmartScreen warning because the installer is not code-signed yet: choose *More info → Run anyway*.
            - **Ubuntu / Debian:** download the `.deb` and run `sudo apt install ./Vico_*.deb`.
            - **Fedora / openSUSE:** download the `.rpm` and run `sudo dnf install ./Vico-*.rpm` (or `zypper install`).
            - **Any other Linux:** download the `.AppImage`, run `chmod +x Vico_*.AppImage`, then open it.

            Then press **Win + Alt + V** (Ctrl + Alt + V if that shortcut is taken) and paste your free Gemini access code once.
