[project]
name = "vico-speech-server"
version = "0.1.0"
description = "Self-hosted speech recognition (Meta Omnilingual ASR) and Nigerian voices (YarnGPT) for Vico"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "numpy>=1.26",
    "huggingface_hub>=0.26",
]

[project.optional-dependencies]
# Meta Omnilingual ASR (Apache-2.0). Needs fairseq2, which ships wheels for Linux x86-64
# and Apple-silicon macOS only; on ARM Linux it must be built from source (see README).
asr = ["omnilingual-asr"]
# YarnGPT voices (Apache-2.0 model, MIT code). outetts 0.2.3 is the version YarnGPT pins.
voice = ["torch", "torchaudio", "transformers", "outetts==0.2.3", "uroman", "inflect"]

[tool.uv]
package = false
