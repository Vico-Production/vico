[project]
name = "vico-agent"
version = "0.1.0"
description = "Local agent sidecar for the Vico desktop assistant"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Not yet chosen; see LICENSE" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "keyring>=25",
    "send2trash>=1.8",
    "sounddevice>=0.5",
    "playwright>=1.48",
    "pywinauto>=0.6.8; sys_platform == 'win32'",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "pyinstaller>=6.11",
    "numpy>=1.26",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["../../tests/unit", "../../tests/integration"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "windows: requires Windows",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607", "S404", "E501", "UP046"]

[tool.ruff.lint.per-file-ignores]
"../../tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
